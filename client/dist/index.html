    <script>
      // Resolve social/canonical URLs against the real origin so sharing works
      // regardless of the host this is served from.
      (function () {
        try {
          var origin = location.origin;
          function setAbs(selector, attr) {
            var el = document.querySelector(selector);
            if (el) el.setAttribute(attr, origin + (el.getAttribute(attr) || '/'));
          }
          // Ensure canonical link exists
          var canonical = document.querySelector('link[rel="canonical"]');
          if (!canonical) {
            canonical = document.createElement('link');
            canonical.rel = 'canonical';
            document.head.appendChild(canonical);
          }
          // Ensure og:url meta exists
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (!ogUrl) {
            ogUrl = document.createElement('meta');
            ogUrl.setAttribute('property', 'og:url');
            document.head.appendChild(ogUrl);
          }
          setAbs('link[rel="canonical"]', 'href');
          setAbs('meta[property="og:url"]', 'content');
          setAbs('meta[property="og:image"]', 'content');
          setAbs('meta[name="twitter:image"]', 'content');
        } catch (e) {}
      })();
    </script>
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('up-radio:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
