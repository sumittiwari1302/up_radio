<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — UP Radio</title>
    <meta name="description" content="That frequency could not be tuned. Head back to UP Radio to browse every Uttar Pradesh station." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4a12a'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='%231a1204'%3EUP%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
        background:
          radial-gradient(900px 520px at 50% -12%, #1d1d23 0%, transparent 60%),
          radial-gradient(500px 300px at 85% 110%, rgba(244,161,42,0.12) 0%, transparent 60%),
          #0b0b0d;
        color: #f4f4f6;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
      }
      .card {
        text-align: center;
        max-width: 520px;
        border: 1px solid #2e2e36;
        border-radius: 22px;
        padding: 3rem 2rem;
        background: linear-gradient(180deg, #1b1b21 0%, #121216 100%);
        box-shadow: 0 30px 80px -40px rgba(0,0,0,0.9);
      }
      .code { font-family: 'JetBrains Mono', monospace; font-size: clamp(4rem, 16vw, 6.5rem); font-weight: 700; line-height: 1; background: linear-gradient(120deg, #f4a12a, #e07d0c); -webkit-background-clip: text; background-clip: text; color: transparent; }
      h1 { font-size: 1.5rem; margin-top: 0.6rem; }
      .sub { color: #a2a2ad; font-size: 0.95rem; margin-top: 0.8rem; }
      .hi { font-family: 'Noto Sans Devanagari', sans-serif; color: #8a8a97; font-size: 0.9rem; margin-top: 0.2rem; }
      .freq { font-family: 'JetBrains Mono', monospace; color: #8a8a97; font-size: 0.8rem; margin: 1.1rem 0 1.6rem; letter-spacing: 0.08em; }
      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.7rem 1.3rem; border-radius: 12px;
        background: #f4a12a; color: #1a1204; font-weight: 600; font-size: 0.95rem;
        text-decoration: none; transition: transform 0.15s ease, filter 0.15s ease;
      }
      .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
      .links { margin-top: 1.4rem; display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; }
      .links a { color: #a2a2ad; font-size: 0.85rem; text-decoration: none; }
      .links a:hover { color: #f4a12a; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="code">404</div>
        <h1>Wrong frequency</h1>
        <p class="sub">This page is off the air — it doesn’t exist or was moved.</p>
        <p class="hi">यह पृष्ठ प्रसारित नहीं हो रहा है</p>
        <p class="freq">NO SIGNAL • 0.0 kHz</p>
        <a class="btn" href="/">&#9679; Tune back in</a>
        <div class="links">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="mailto:sumittiwari1302@gmail.com">Contact</a>
        </div>
      </div>
    </main>
  </body>
</html>
